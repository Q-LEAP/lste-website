# Publishes the next queued blog article every Monday morning.
#
# The articles of the "LSTE Blog & SEO Content Plan" (autumn 2026) are written
# in advance in src/news-queue/, one folder per article, with their dates in
# src/news-queue/schedule.json. scripts/publish-scheduled-news.mjs moves every
# article whose date has come into news/, adds its card to /news/ and the
# homepage, and updates sitemap.xml. This job runs it and commits the result,
# so nobody has to remember to publish.
#
# Pushes made with GITHUB_TOKEN do not reliably start a GitHub Pages build, so
# the job asks Pages for one explicitly after pushing.
name: Publish weekly news

on:
  schedule:
    # Mondays 05:00 UTC = 07:00 in Luxembourg in summer time, 06:00 in winter.
    # GitHub may start scheduled jobs late under load; a few minutes is normal.
    - cron: '0 5 * * 1'
  # Publish by hand from the Actions tab (e.g. after moving a date earlier).
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-weekly-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: the publish script and the three build steps it
      # re-runs use only the Node standard library.
      - name: Publish due articles
        run: node scripts/publish-scheduled-news.mjs

      - name: Commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing due this week."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A news index.html sitemap.xml
          git commit -m "News: publish this week's article"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
