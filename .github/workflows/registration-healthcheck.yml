# Watches the registration funnel and shouts when it breaks.
#
# The site is static, so a deploy being green says nothing about whether people
# can actually register: the form lives on an Odoo tenant we do not control. On
# 2026-09-17 that tenant returned HTTP 500 on every event page for an unknown
# number of days and we learned about it from a prospective attendee's email.
# This job closes that blind spot.
#
# On failure it opens a single GitHub issue and assigns it, which is what
# actually sends the alert email: GitHub notifies an assignee whatever their
# watch settings are, so this works with no mail server, no API key and no
# secret to expire. The issue stays open until the funnel recovers, then gets a
# comment and closes itself.
#
# Everything here is built around one rule: one alert per outage, not one per
# run. The issue is opened once, the run fails once, and the optional mails go
# out once. A healthy funnel is completely silent.
name: Registration health check

on:
  schedule:
    # Every 15 minutes. GitHub runs scheduled jobs on a best-effort basis and
    # can delay them under load, so treat this as "roughly every 15 minutes".
    - cron: '*/15 * * * *'
  # Lets you re-run it by hand from the Actions tab the moment Odoo claims a fix.
  workflow_dispatch:
  # Catches a broken or stale registration link at the moment it is committed,
  # rather than up to 15 minutes later.
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/check-registration.mjs'
      - '.github/workflows/registration-healthcheck.yml'

# Needed to open, comment on and close the outage issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: registration-healthcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step on purpose: the probe uses only the Node standard
      # library, so it cannot be broken by a dependency and needs no lockfile.
      - name: Probe the registration funnel
        id: probe
        run: |
          set +e
          node scripts/check-registration.mjs > result.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt

      - name: Open or update the outage issue
        id: issue
        if: steps.probe.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('result.txt', 'utf8');
            const LABEL = 'registration-outage';
            // Being assigned an issue always sends that person a notification
            // email, whatever their repo watch setting is — which is what makes
            // this alert work with no mail server, no API key and no secrets to
            // rotate. Add or remove GitHub usernames here to change who gets
            // paged; every repo admin is a valid choice.
            const ASSIGNEES = ['Komorebideuxiemedunom'];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Make sure the label exists before filtering on it.
            try {
              await github.rest.issues.createLabel({
                ...context.repo, name: LABEL, color: 'b60205',
                description: 'Attendees cannot register',
              });
            } catch (e) { /* already exists */ }

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL,
            });

            const body = [
              '**Attendees cannot register right now.**',
              '',
              'The "Register for free" buttons on the site lead to a page that is not serving a',
              'working registration form. The site itself is fine — this is almost always the',
              'Odoo tenant that hosts the form.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `[Full run log](${runUrl})`,
              '',
              '---',
              'This issue closes itself automatically once the funnel recovers.',
            ].join('\n');

            if (open.length > 0) {
              // Already reported. Stay quiet rather than commenting every 15
              // minutes — a noisy alert is an ignored alert. Refresh the body
              // so the issue always shows the latest probe output.
              await github.rest.issues.update({
                ...context.repo, issue_number: open[0].number, body,
              });
              core.notice(`Outage already tracked in #${open[0].number}`);
              // Already-known outage: no email. This flag is what keeps a
              // three-day outage to one alert instead of 288.
              core.setOutput('new_outage', 'false');
            } else {
              const { data: issue } = await github.rest.issues.create({
                ...context.repo,
                title: '🚨 Registration is broken — attendees cannot sign up',
                body,
                labels: [LABEL],
                assignees: ASSIGNEES,
              });
              core.notice(`Opened outage issue #${issue.number}`);
              core.setOutput('new_outage', 'true');
              core.setOutput('issue_url', issue.html_url);
            }
            core.setOutput('report', report.trim());

      - name: Close the outage issue on recovery
        id: recovery
        if: steps.probe.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'registration-outage';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: '✅ Recovered — the registration funnel is answering normally again.',
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }
            // Only true on the run where it actually came back, so a healthy
            // funnel stays completely silent from then on.
            core.setOutput('recovered', open.length > 0 ? 'true' : 'false');

      # --- Email alerts -------------------------------------------------
      # Two emails per outage at most: one when it breaks, one when it is back.
      # A healthy funnel never sends anything.
      #
      # Both steps stay dormant until the SMTP secrets exist, so the check keeps
      # working as-is if they are never set. They are also continue-on-error: a
      # mail server problem must never turn a healthy run red, nor mask a real
      # outage behind a delivery failure.
      - name: Email the team — registration just broke
        if: steps.probe.outputs.exit_code != '0' && steps.issue.outputs.new_outage == 'true' && env.SMTP_PASSWORD != ''
        continue-on-error: true
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: LSTE site monitor <${{ secrets.SMTP_FROM }}>
          to: hello@lste.lu
          subject: '[LSTE] ALERTE — les inscriptions sont cassées'
          body: |
            Les boutons « Register for free » du site ne mènent plus à un
            formulaire d'inscription fonctionnel.

            Le site lste.lu est en ligne : le problème vient quasi
            systématiquement de l'Odoo qui héberge le formulaire.

            Détail de la sonde :

            ${{ steps.issue.outputs.report }}

            Suivi : ${{ steps.issue.outputs.issue_url }}

            Vous recevrez un second mail dès le rétablissement.
            (Un seul mail par panne — pas de rappel toutes les 15 minutes.)

      - name: Email the team — registration is back
        if: steps.probe.outputs.exit_code == '0' && steps.recovery.outputs.recovered == 'true' && env.SMTP_PASSWORD != ''
        continue-on-error: true
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: LSTE site monitor <${{ secrets.SMTP_FROM }}>
          to: hello@lste.lu
          subject: '[LSTE] Rétabli — les inscriptions refonctionnent'
          body: |
            La sonde vient de confirmer que le tunnel d'inscription répond
            de nouveau normalement. Rien à faire.

      # A failing run is GitHub's own alert channel: it emails whoever last
      # touched this workflow, with no configuration on our side. That makes it
      # the alert, which means it has to follow the same rule as the issue and
      # the mails — one per outage, not one per run. Failing on every run would
      # send ~96 mails a day and get the whole thing muted within a week.
      #
      # So the run status answers "did this check find something new to tell
      # you", while the open issue answers "is the funnel broken right now".
      # An ongoing outage therefore shows a green run and a very loud summary,
      # and the issue stays open the whole time.
      - name: Fail the run on a newly detected outage
        if: steps.issue.outputs.new_outage == 'true'
        run: |
          {
            echo "## 🚨 Registration just broke"
            echo ""
            echo "Opened ${{ steps.issue.outputs.issue_url }} and assigned it."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report an ongoing outage without re-alerting
        if: steps.probe.outputs.exit_code != '0' && steps.issue.outputs.new_outage == 'false'
        run: |
          echo "::warning::Registration is STILL broken — already tracked, not re-alerting."
          {
            echo "## ⚠️ Registration is still broken"
            echo ""
            echo "This outage is already reported, so this run stays green on purpose"
            echo "to avoid a duplicate alert. The open \`registration-outage\` issue is"
            echo "the live status."
          } >> "$GITHUB_STEP_SUMMARY"
